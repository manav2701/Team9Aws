<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="2360" height="1120">
<rect width="1180" height="560" fill="#fbfcfd"/>
<style>text{font-family:'Helvetica Neue',Arial,sans-serif;fill:#1d2a33}.t{font-size:15px;font-weight:700}.s{font-size:12px;fill:#4a5a66}
.b{fill:#fff;stroke:#2f6db5;stroke-width:1.8}.g{fill:#e6f5f0;stroke:#0c7a64;stroke-width:2}.r{fill:#fdecea;stroke:#b42318;stroke-width:2}.o{fill:#fff6e8;stroke:#c77700;stroke-width:2}
.d{fill:#fff;stroke:#6b7b86;stroke-width:1.8}.a{fill:none;stroke:#6b7b86;stroke-width:1.8;marker-end:url(#m)}.l{font-size:12px;font-weight:700}</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6b7b86"/></marker></defs>
<text x="20" y="34" class="t" style="font-size:20px">Shifa / Health Companion: patient workflow</text>
<rect x="20" y="70" width="160" height="70" rx="8" class="b"/><text x="34" y="98" class="t">1. Patient types</text><text x="34" y="118" class="s">symptoms in web chat</text>
<rect x="220" y="70" width="170" height="70" rx="8" class="g"/><text x="234" y="98" class="t">2. Guardrail check</text><text x="234" y="118" class="s">Bedrock Guardrail v3</text>
<polygon points="305,170 380,210 305,250 230,210" class="d"/><text x="262" y="206" class="s">Diagnosis /</text><text x="262" y="222" class="s">dose / treat?</text>
<rect x="20" y="175" width="170" height="70" rx="8" class="r"/><text x="34" y="203" class="t">Refuse politely</text><text x="34" y="223" class="s">offer doctor + booking</text>
<rect x="430" y="70" width="190" height="70" rx="8" class="b"/><text x="444" y="98" class="t">3. HealthAgent</text><text x="444" y="118" class="s">Claude Sonnet 5 (Strands)</text>
<rect x="430" y="170" width="190" height="80" rx="8" class="b"/><text x="444" y="196" class="t">4. Check patient</text><text x="444" y="215" class="s">get_patient_profile</text><text x="444" y="233" class="s">history + medications</text>
<rect x="660" y="170" width="190" height="80" rx="8" class="b"/><text x="674" y="196" class="t">5. Triage urgency</text><text x="674" y="215" class="s">Knowledge Base:</text><text x="674" y="233" class="s">triage guidance</text>
<polygon points="755,280 840,320 755,360 670,320" class="d"/><text x="712" y="316" class="s">Red flag?</text><text x="712" y="332" class="s">(worst headache…)</text>
<rect x="890" y="285" width="270" height="70" rx="8" class="r"/><text x="904" y="313" class="t">EMERGENCY: call now</text><text x="904" y="333" class="s">emergency services / ER, no booking</text>
<rect x="580" y="400" width="190" height="80" rx="8" class="b"/><text x="594" y="426" class="t">6. Find provider</text><text x="594" y="445" class="s">search_providers</text><text x="594" y="463" class="s">(neurology / eye)</text>
<rect x="800" y="400" width="190" height="80" rx="8" class="o"/><text x="814" y="426" class="t">7. Book</text><text x="814" y="445" class="s">book_appointment, or</text><text x="814" y="463" class="s">Twilio call to clinic (M2)</text>
<rect x="1010" y="400" width="150" height="80" rx="8" class="g"/><text x="1024" y="426" class="t">8. Summary</text><text x="1024" y="445" class="s">generate_visit_</text><text x="1024" y="463" class="s">summary for doctor</text>
<path d="M180,105L218,105" class="a"/><path d="M305,140L305,168" class="a"/>
<path d="M230,210L192,210" class="a"/><text x="196" y="202" class="l" style="fill:#b42318">yes</text>
<path d="M380,210L405,210L405,105L428,105" class="a"/><text x="384" y="202" class="l" style="fill:#0c7a64">no</text>
<path d="M525,140L525,168" class="a"/><path d="M620,210L658,210" class="a"/><path d="M755,250L755,278" class="a"/>
<path d="M840,320L888,320" class="a"/><text x="846" y="312" class="l" style="fill:#b42318">yes</text>
<path d="M755,360L755,380L675,380L675,398" class="a"/><text x="760" y="376" class="l" style="fill:#0c7a64">no</text>
<path d="M770,440L798,440" class="a"/><path d="M990,440L1008,440" class="a"/>
<text x="20" y="530" class="s">Every answer ends with "This is not medical advice." Web app on Lambda function URL; agent on AgentCore Runtime (us-west-2).</text>
</svg>
