<text x="38" y="511" class="s">run_tests.py → invoke_agent_runtime, 18 prompts</text>
<text x="38" y="532" class="s">results → test_results/*.csv → pass-rate slide</text>
<g class="legend">
<rect x="560" y="452" width="14" height="14" rx="3" class="sw m1f"/><text x="582" y="464" class="s">M1 Agent builder</text>
<rect x="560" y="478" width="14" height="14" rx="3" class="sw m2f"/><text x="582" y="490" class="s">M2 Tools &amp; data</text>
<rect x="760" y="452" width="14" height="14" rx="3" class="sw m3f"/><text x="782" y="464" class="s">M3 Safety &amp; testing (you)</text>
<rect x="760" y="478" width="14" height="14" rx="3" class="sw m4f"/><text x="782" y="490" class="s">M4 UI &amp; demo</text>
</g>
