<rect x="750" y="320" width="200" height="80" rx="8" class="box m2s"/>
<text x="766" y="346" class="t">Lambda tools · M2</text>
<text x="766" y="366" class="s">profile · meds · providers</text>
<text x="766" y="385" class="s">booking · visit summary</text>
<rect x="990" y="290" width="150" height="56" rx="8" class="box m2s"/>
