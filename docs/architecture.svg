<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 580" width="2320" height="1160"><rect width="1160" height="580" fill="#fbfcfd"/><style>
text{font-family:'Helvetica Neue',Arial,sans-serif;fill:#1d2a33}
.t{font-size:15px;font-weight:700}.s{font-size:12.5px;fill:#4a5a66}.strong{font-weight:700;fill:#b42318}
.lbl{font-size:13px;font-weight:700;letter-spacing:.4px}
.box{fill:#ffffff;stroke:#b8c4cc;stroke-width:1.5}.dashed{stroke-dasharray:5 4}
.zone{fill:#f3f7fa;stroke-width:1.5;stroke-dasharray:6 5}
.m1s{stroke:#2f6db5}.m2s{stroke:#7a5bc4}.m4s{stroke:#c77700}
.m1t{fill:#2f6db5}.m3t{fill:#0c7a64}
.shield{fill:#e6f5f0;stroke:#0c7a64;stroke-width:3}
.harness{fill:#e6f5f0;stroke:#0c7a64;stroke-width:2}
.m1f{fill:#2f6db5}.m2f{fill:#7a5bc4}.m3f{fill:#0c7a64}.m4f{fill:#c77700}
.ar{fill:none;stroke:#6b7b86;stroke-width:1.8;marker-end:url(#ah)}.m3a{stroke:#0c7a64}
.ahead{fill:#6b7b86}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker></defs>
<rect x="370" y="30" width="340" height="370" rx="10" class="zone m1s"/>
<text x="388" y="54" class="lbl m1t">AgentCore Runtime · M1</text>
<rect x="390" y="70" width="300" height="92" rx="8" class="box m1s"/>
<text x="406" y="98" class="t">HealthAgent (Strands)</text>
<text x="406" y="120" class="s">system prompt · red-flag override</text>
<text x="406" y="140" class="s">JSON reply for the app</text>
<rect x="390" y="200" width="300" height="62" rx="8" class="box m1s"/>
