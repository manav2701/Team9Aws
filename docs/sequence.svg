<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="2400" height="1400">
<rect width="1200" height="700" fill="#fbfcfd"/>
<style>text{font-family:'Helvetica Neue',Arial,sans-serif;fill:#1d2a33}.t{font-size:14px;font-weight:700}.s{font-size:12px;fill:#1d2a33}.n{font-size:11px;fill:#6b7b86}
.hd{fill:#fff;stroke:#2f6db5;stroke-width:1.8}.life{stroke:#b8c4cc;stroke-width:1.5;stroke-dasharray:5 5}.a{fill:none;stroke:#2f6db5;stroke-width:1.6;marker-end:url(#m)}.r{fill:none;stroke:#6b7b86;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#m2)}
.alt{fill:#fdecea;stroke:#b42318;stroke-width:1.2}</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2f6db5"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6b7b86"/></marker></defs>
<text x="20" y="32" class="t" style="font-size:20px">Sequence: patient asks for help</text>
<g>
<rect x="30" y="50" width="120" height="40" rx="6" class="hd"/><text x="52" y="75" class="t">Patient</text>
<rect x="180" y="50" width="140" height="40" rx="6" class="hd"/><text x="196" y="75" class="t">Web Lambda</text>
<rect x="350" y="50" width="140" height="40" rx="6" class="hd"/><text x="364" y="75" class="t">HealthAgent</text>
<rect x="520" y="50" width="140" height="40" rx="6" class="hd"/><text x="534" y="75" class="t">Guardrail</text>
<rect x="690" y="50" width="140" height="40" rx="6" class="hd"/><text x="702" y="75" class="t">Claude Sonnet 5</text>
<rect x="860" y="50" width="140" height="40" rx="6" class="hd"/><text x="870" y="75" class="t">Gateway+Tools λ</text>
<rect x="1030" y="50" width="140" height="40" rx="6" class="hd"/><text x="1040" y="75" class="t">DynamoDB / KB</text>
</g>
<path d="M90,90L90,680 M250,90L250,680 M420,90L420,680 M590,90L590,680 M760,90L760,680 M930,90L930,680 M1100,90L1100,680" class="life"/>
<path d="M90,125L248,125" class="a"/><text x="98" y="118" class="s">1. "Headache + blurry vision 3 days"</text>
<path d="M250,160L418,160" class="a"/><text x="258" y="153" class="s">2. invoke(prompt, patient_id)</text>
<path d="M420,195L588,195" class="a"/><text x="428" y="188" class="s">3. ApplyGuardrail(question)</text>
<path d="M590,225L422,225" class="r"/><text x="470" y="218" class="n">allowed</text>
<path d="M420,260L758,260" class="a"/><text x="470" y="253" class="s">4. reason with system prompt + tools</text>
<path d="M760,295L928,295" class="a"/><text x="768" y="288" class="s">5. get_patient_profile</text>
<path d="M930,320L1098,320" class="a"/><text x="938" y="313" class="s">6. read PAT-01</text>
<path d="M1100,345L932,345" class="r"/><text x="960" y="365" class="n">hypertension, amlodipine</text>
<path d="M930,380L762,380" class="r"/>
<path d="M760,410L928,410" class="a"/><text x="768" y="403" class="s">7. triage guidance / providers</text>
<path d="M930,430L1098,430" class="a"/><path d="M1100,450L932,450" class="r"/><path d="M930,470L762,470" class="r"/>
<path d="M760,500L422,500" class="r"/><text x="470" y="493" class="n">answer: see doctor within 24h + booking offer</text>
<path d="M420,525L252,525" class="r"/><path d="M250,550L92,550" class="r"/><text x="98" y="543" class="n">reply + "not medical advice"</text>
<rect x="30" y="580" width="1150" height="100" rx="8" class="alt"/>
<text x="42" y="600" class="t" style="fill:#b42318">alt</text>
<text x="80" y="600" class="s">Unsafe question ("what dose should I take?"): step 3 → Guardrail blocks → HealthAgent returns refusal + safe next step, the model is never called.</text>
<text x="80" y="625" class="s">Red flag ("worst headache of my life"): step 4 → model follows red-flag rule → "call emergency services now", no booking tool called.</text>
<text x="80" y="650" class="s">"Call now" button: Web Lambda → Voice Lambda (workshop-shifa-calls) → Twilio rings clinic → transcript saved in DynamoDB → web polls it.</text>
</svg>
